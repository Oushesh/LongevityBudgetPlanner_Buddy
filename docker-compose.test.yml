services:
  backend:
    image: python:3.12-slim
    working_dir: /app/django
    volumes:
      - ./:/app
    command: >
      sh -c "pip install --no-cache-dir uv &&
             uv sync &&
             uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', 8000)); s.close()"]
      interval: 3s
      timeout: 2s
      retries: 25

  frontend:
    image: node:22-bullseye
    working_dir: /app/frontend
    volumes:
      - ./:/app
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      COREPACK_HOME: /tmp/corepack
    command: >
      sh -c "corepack enable &&
             pnpm install &&
             pnpm dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 3s
      timeout: 3s
      retries: 25

  e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /app/frontend
    volumes:
      - ./:/app
    environment:
      E2E_BASE_URL: http://frontend:3000
      NEXT_PUBLIC_API_URL: http://backend:8000
      COREPACK_HOME: /tmp/corepack
    command: >
      sh -c "corepack enable &&
             pnpm install &&
             pnpm exec playwright install chromium &&
             pnpm test:e2e"
    depends_on:
      frontend:
        condition: service_healthy
